<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi aplicación web</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1419;
        --card: #1a2332;
        --accent: #3b82f6;
        --text: #e8eef5;
        --muted: #94a3b8;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f0f4f8;
          --card: #ffffff;
          --accent: #2563eb;
          --text: #0f172a;
          --muted: #64748b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(
            ellipse 120% 80% at 50% -20%,
            rgba(59, 130, 246, 0.15),
            transparent 50%
          ),
          var(--bg);
        color: var(--text);
        padding: 1.5rem;
      }
      main {
        max-width: 36rem;
        width: 100%;
        padding: 2.5rem 2rem;
        background: var(--card);
        border-radius: 1rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(148, 163, 184, 0.12);
        text-align: center;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        margin: 0;
        font-size: 1.125rem;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bienvenido a <span>mi aplicación web</span></h1>
      <p>Este es mi primer despliegue automático</p>
    </main>
  </body>
</html>
